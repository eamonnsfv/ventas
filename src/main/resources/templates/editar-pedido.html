<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar pedido | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Editar pedido</h1>
                <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver</a>
            </div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form class="bg-white border rounded p-4" th:action="@{/pedidos/editar/{id}(id=${pedido.id})}" th:object="${pedido}" method="post">
                <div class="row g-3">
                    <div class="col-12"><label class="form-label" for="id">Id</label><input class="form-control" id="id" th:field="*{id}" readonly></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="total">Total</label><input class="form-control" id="total" type="number" step="0.01" min="0" th:field="*{total}" required></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="fecha">Fecha</label><input class="form-control" id="fecha" type="date" th:field="*{fecha}"></div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="clienteId">Cliente</label>
                        <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                            <option value="0">Selecciona un cliente</option>
                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}">Cliente</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="comercialId">Comercial</label>
                        <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                            <option value="0">Selecciona un comercial</option>
                            <option th:each="comercial : ${comerciales}" th:value="${comercial.id}" th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">Comercial</option>
                        </select>
                    </div>
                    <div class="col-12 d-flex justify-content-end"><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>

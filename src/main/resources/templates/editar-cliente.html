<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2 mb-0">Editar cliente</h1>
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a>
            </div>
            <form class="bg-white border rounded p-4" th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post">
                <div class="row g-3">
                    <div class="col-12"><label class="form-label" for="id">Id</label><input class="form-control" id="id" th:field="*{id}" readonly></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="apellido1">Primer apellido</label><input class="form-control" id="apellido1" th:field="*{apellido1}" required></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="apellido2">Segundo apellido</label><input class="form-control" id="apellido2" th:field="*{apellido2}"></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" th:field="*{ciudad}" required></div>
                    <div class="col-12 col-md-6"><label class="form-label" for="categoria">Categoría</label><input class="form-control" id="categoria" type="number" min="0" th:field="*{categoría}" required></div>
                    <div class="col-12 d-flex justify-content-end"><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>

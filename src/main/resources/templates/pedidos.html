<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container py-4">
    <div class="row align-items-center mb-4">
        <div class="col-12 col-md-8"><h1 class="mb-0">Pedidos</h1></div>
        <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
            <a class="btn btn-primary" th:href="@{/pedidos/crear}">Crear pedido</a>
        </div>
    </div>
    <div class="row g-2 bg-dark text-white fw-semibold rounded-top p-3 d-none d-lg-flex">
        <div class="col-lg-1">Id</div><div class="col-lg-2">Total</div><div class="col-lg-2">Fecha</div>
        <div class="col-lg-2">Cliente</div><div class="col-lg-2">Comercial</div><div class="col-lg-3 text-lg-end">Acciones</div>
    </div>
    <div class="row g-2 align-items-center bg-white border rounded p-3 mb-2" th:each="pedido : ${pedidos}">
        <div class="col-6 col-lg-1"><span class="d-lg-none fw-semibold">Id: </span><span th:text="${pedido.id}">0</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Total: </span><span th:text="${pedido.total}">0.00</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Fecha: </span><span th:text="${pedido.fecha ?: '-'}">-</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Cliente: </span><span th:text="${pedido.clienteNombre}">Cliente</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Comercial: </span><span th:text="${pedido.comercialNombre}">Comercial</span></div>
        <div class="col-12 col-lg-3 d-flex flex-wrap justify-content-lg-end gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver detalle</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
            <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                <button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>

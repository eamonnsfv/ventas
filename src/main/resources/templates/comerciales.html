<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comerciales | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container py-4">
    <div class="row align-items-center mb-4">
        <div class="col-12 col-md-8"><h1 class="mb-0">Comerciales</h1></div>
        <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
            <a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear comercial</a>
        </div>
    </div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="row g-2 bg-dark text-white fw-semibold rounded-top p-3 d-none d-lg-flex">
        <div class="col-lg-1">Id</div><div class="col-lg-2">Nombre</div><div class="col-lg-2">Apellidos</div>
        <div class="col-lg-1">Comisión</div><div class="col-lg-6 text-lg-end">Acciones</div>
    </div>
    <div class="row g-2 align-items-center bg-white border rounded p-3 mb-2" th:each="comercial : ${comerciales}">
        <div class="col-6 col-lg-1"><span class="d-lg-none fw-semibold">Id: </span><span th:text="${comercial.id}">0</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Nombre: </span><span th:text="${comercial.nombre}">Nombre</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none fw-semibold">Apellidos: </span><span th:text="${comercial.apellido1 + ' ' + (comercial.apellido2 ?: '')}">Apellidos</span></div>
        <div class="col-6 col-lg-1"><span class="d-lg-none fw-semibold">Comisión: </span><span th:text="${comercial.comisión}">0</span></div>
        <div class="col-12 col-lg-6 d-flex flex-wrap justify-content-lg-end gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver detalle</a>
            <a class="btn btn-outline-primary btn-sm" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
            <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
                <button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
